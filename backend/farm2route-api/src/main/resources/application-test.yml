spring:
  datasource:
    url: jdbc:h2:mem:farm2route_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

security:
  password:
    bcrypt-strength: 12
    min-length: 8
    max-length: 128
    weak-passwords:
      - password
      - password123
      - 12345678
      - qwerty123
      - admin123
  jwt:
    active-key-id: test-key-2026
    active-secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-minutes: 15
    clock-skew-seconds: 30
    refresh-token-expiration-ms: 86400000
    issuer: farm2route-test
  otp:
    length: 6
    expiry-minutes: 5
    max-attempts: 5
    max-requests: 3
    request-window-minutes: 10
    provider: mock
  login:
    max-failed-attempts: 5
    lock-duration-minutes: 15
  rate-limit:
    login:
      max-attempts: 5
      window-minutes: 15
    registration:
      max-attempts: 5
      window-minutes: 15

app:
  supabase:
    url: https://placeholder.supabase.co
    service-key: placeholder-key
    storage-bucket: farm2route-storage

logging:
  level:
    root: WARN
    com.farm2route: INFO
