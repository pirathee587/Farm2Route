spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:aws-0-ap-northeast-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
    username: ${DB_USER:postgres.rdubfzmiyeqdjpsqekri}
    password: ${DB_PASSWORD:Kavisanth16@}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    listener:
      simple:
        # Default to false so local dev without a running RabbitMQ broker does not spam logs.
        # Set RABBITMQ_LISTENER_AUTO_STARTUP=true when running a local broker (e.g. Docker).
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:false}

logging:
  level:
    root: INFO
    com.farm2route: DEBUG
    org.springframework.security: INFO

security:
  jwt:
    blacklist-fail-closed: false
