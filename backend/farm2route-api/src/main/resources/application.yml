spring:
  application:
    name: farm2route-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: console

server:
  port: ${PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# Application Custom Properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000} # 7 days
    issuer: farm2route
  otp:
    provider: ${OTP_PROVIDER:mock}
    length: 6
    expiration-minutes: 5
    max-attempts: 5
    rate-limit-seconds: 60
  supabase:
    url: ${SUPABASE_URL:https://placeholder.supabase.co}
    service-key: ${SUPABASE_SERVICE_KEY:placeholder-key}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:farm2route-storage}
    buckets:
      kyc-documents: kyc-documents
      pod-photos: pod-photos
      incident-evidence: incident-evidence
      profile-images: profile-images
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5000,*}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
