spring:
  application:
    name: farm2route-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: console
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:farm2route}
    password: ${RABBITMQ_PASS:farm2route_dev}
    listener:
      simple:
        # CRITICAL: must be false so rejected messages go to DLQ instead of re-queuing forever
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000
        acknowledge-mode: auto

server:
  port: ${PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# Production Security & Auth Configuration
security:
  password:
    bcrypt-strength: 12
    min-length: 8
    max-length: 128
    weak-passwords:
      - password
      - password123
      - 12345678
      - 123456789
      - qwerty123
      - admin123
      - welcome123
      - farm2route123

  jwt:
    active-key-id: ${JWT_ACTIVE_KEY_ID:farm2route-key-2026-01}
    active-secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    previous-keys: ${JWT_PREVIOUS_KEYS:} # Format: key-id:secret,key-id-2:secret-2
    access-token-minutes: 15
    clock-skew-seconds: 30
    refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000} # 7 days
    issuer: farm2route

  otp:
    length: 6
    expiry-minutes: 5
    max-attempts: 5
    max-requests: 3
    request-window-minutes: 10
    provider: ${OTP_PROVIDER:mock}

  login:
    max-failed-attempts: 5
    lock-duration-minutes: 15

  rate-limit:
    login:
      max-attempts: 5
      window-minutes: 15
    registration:
      max-attempts: 5
      window-minutes: 15

# Twilio Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}

# Application custom properties (Supabase storage, CORS)
app:
  supabase:
    url: ${SUPABASE_URL:https://placeholder.supabase.co}
    service-key: ${SUPABASE_SERVICE_KEY:placeholder-key}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:farm2route-storage}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
