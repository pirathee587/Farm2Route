name: farm2route_app
description: "Farm2Route - Scalable Agricultural Logistics and Fleet Management Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Routing & Navigation
  go_router: ^14.2.0

  # Networking & REST API
  dio: ^5.4.3+1

  # Secure Storage (Keychain / EncryptedSharedPreferences)
  flutter_secure_storage: ^9.2.2

  # Location & Maps
  latlong2: ^0.9.1
  geolocator: ^12.0.0

  # UI, Icons, Typography
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
