version: '3.8'

services:
  # Farm2Route Spring Boot API
  farm2route-api:
    build:
      context: ./backend/farm2route-api
      dockerfile: Dockerfile
    container_name: farm2route-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=${DB_HOST:-aws-0-ap-southeast-1.pooler.supabase.com}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-postgres.your-project-ref}
      - DB_PASSWORD=${DB_PASSWORD:-your-supabase-db-password}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-900000}
      - REFRESH_TOKEN_EXPIRATION_MS=${REFRESH_TOKEN_EXPIRATION_MS:-604800000}
      - SUPABASE_URL=${SUPABASE_URL:-https://your-project-ref.supabase.co}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-your-supabase-service-role-key}
      - OTP_PROVIDER=${OTP_PROVIDER:-mock}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
